controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: parallel_gripper_action_controller/GripperActionController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    interpolation_method: splines

panda_hand_controller:
  # parallel_gripper_action_controller commands BOTH finger joints in
  # lockstep (panda_finger_joint1 + panda_finger_joint2), which the
  # legacy position_controllers/GripperActionController could not do
  # after we stripped the URDF <mimic> tag for DART compatibility.
  ros__parameters:
    joint: panda_finger_joint1
    second_joint: panda_finger_joint2
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    goal_tolerance: 0.005
    max_effort: 100.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 0.8
