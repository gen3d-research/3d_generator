controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: forward_command_controller/ForwardCommandController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    interpolation_method: splines

panda_hand_controller:
  # Effort (force) control on both finger joints. The driver publishes a
  # Float64MultiArray [f1, f2] to /panda_hand_controller/commands: a NEGATIVE
  # force closes/squeezes (both fingers' +position is "open"), a positive force
  # opens. A constant closing force is held through lift/transport, so the
  # object is retained by friction — a genuine physics grasp.
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    interface_name: effort
