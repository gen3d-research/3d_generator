# MoveItCpp options for the headless planning evaluator.
planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  joint_state_topic: "/joint_states"
  attached_collision_object_topic: "/moveit_planning_eval/planning_scene_monitor"
  publish_planning_scene_topic: "/moveit_planning_eval/publish_planning_scene"
  monitored_planning_scene_topic: "/moveit_planning_eval/monitored_planning_scene"
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: ["ompl"]

plan_request_params:
  # A REACHABLE grasp succeeds on the first attempt in <1 s, so this budget only
  # bounds time on INFEASIBLE poses. 5 attempts x 4 s = 20 s worst case keeps the
  # wait short when the top-ranked grasps are unreachable (e.g. tall objects'
  # side grasps) while still finding feasible-but-tight near-table grasps.
  planning_attempts: 5
  planning_pipeline: "ompl"
  # CRITICAL: scale motion DOWN. At 1.0 the Panda moved at full speed — the
  # "strange/violent" start-of-plan motion that knocks the object off the table,
  # and the fast lift that breaks the friction grip. 0.2 vel / 0.1 accel is
  # smooth and gentle, holds the grasp, and doesn't disturb the scene.
  max_velocity_scaling_factor: 0.2
  max_acceleration_scaling_factor: 0.1
  planner_id: "RRTConnectkConfigDefault"
  planning_time: 4.0
