# MoveItCpp options for the headless planning evaluator.
planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  joint_state_topic: "/joint_states"
  attached_collision_object_topic: "/moveit_planning_eval/planning_scene_monitor"
  publish_planning_scene_topic: "/moveit_planning_eval/publish_planning_scene"
  monitored_planning_scene_topic: "/moveit_planning_eval/monitored_planning_scene"
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: ["ompl"]

plan_request_params:
  # 15 s + 20 attempts.  Grasping a small object on a table is right at
  # the edge of the Panda's downward reach: the wrist has to wrap over
  # the gripper, the elbow has to be tucked high, and the table
  # CollisionObject squeezes the feasible IK region.  With less budget
  # RRTConnect frequently fails to sample valid goal-tree states.
  planning_attempts: 20
  planning_pipeline: "ompl"
  max_velocity_scaling_factor: 1.0
  max_acceleration_scaling_factor: 1.0
  planner_id: "RRTConnectkConfigDefault"
  planning_time: 15.0
