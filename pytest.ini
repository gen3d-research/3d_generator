[pytest]
testpaths = tests
addopts = -q
# NOTE: if ROS 2 is sourced in your shell, /opt/ros is on PYTHONPATH and pytest
# tries to autoload ROS launch_testing plugins (which need extra deps and fail).
# Run the suite with PYTHONPATH cleared so the tests stay ROS-independent:
#     env -u PYTHONPATH python -m pytest
# (equivalently: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest)
